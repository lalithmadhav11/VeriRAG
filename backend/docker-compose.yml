version: "3.9"

services:
  api:
    build: .
    container_name: verirag_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongo
      - chroma
      - redis
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: verirag_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: verirag_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: verirag_redis
    ports:
      - "6379:6379"
    # Append-only log ensures queued jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  redis_data:
